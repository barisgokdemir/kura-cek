<!doctype html>
<html lang="tr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kura Çek</title>
    <meta name="description" content="Ücretsiz, reklamsız, kayıtsız rastgelelik: 3D yazı-tura, zar, kısa çubuk ve listeden kura. Adil olduğunu kanıtlar." />
    <meta name="theme-color" content="#0a0a1a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="modulepreload" href="js/app.js" />
    <script>
      // Tema, ilk boyamadan önce uygulanır (yanıp sönmeyi önler).
      try {
        const t = JSON.parse(localStorage.getItem('kuracek:v1'))?.settings?.theme;
        if (t) document.documentElement.dataset.theme = t;
      } catch {}
    </script>

      <a href="https://game.socialcpu.com/" rel="noopener">SocialCPU Games</a>

    </footer>
    <nav class="tabbar" aria-label="Ana menü" data-nav></nav>
